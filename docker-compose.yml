services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docuchat-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docuchat123
      POSTGRES_DB: docuchat
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init/00-pgcrypto.sql:/docker-entrypoint-initdb.d/00-pgcrypto.sql:ro
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "docuchat"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docuchat-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    container_name: docuchat-seaweedfs
    command: mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -admin.ui=false -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-docuchat}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-docuchat-s3-development-secret}
      S3_BUCKET: ${S3_BUCKET:-docuchat-documents}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docuchat-backend
    environment:
      DATABASE_URL: postgresql://postgres:docuchat123@db:5432/docuchat
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: seaweedfs
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-docuchat}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-docuchat-s3-development-secret}
      S3_BUCKET: ${S3_BUCKET:-docuchat-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHAT_MODELS: ${CHAT_MODELS:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-6-luna}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      JWT_SECRET: ${JWT_SECRET:-docuchat-production-secret-key-32bytes-minimum-security-token-2026}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UPLOAD_DIR: /app/backend/uploads
      INDEX_DIR: /app/backend/faiss_indexes
    volumes:
      - uploads_data:/app/backend/uploads
      - indexes_data:/app/backend/faiss_indexes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docuchat-worker
    command: python -m backend.jobs.worker
    environment:
      DATABASE_URL: postgresql://postgres:docuchat123@db:5432/docuchat
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: seaweedfs
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-docuchat}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-docuchat-s3-development-secret}
      S3_BUCKET: ${S3_BUCKET:-docuchat-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-6-luna}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      UPLOAD_DIR: /app/backend/uploads
      INDEX_DIR: /app/backend/faiss_indexes
    volumes:
      - uploads_data:/app/backend/uploads
      - indexes_data:/app/backend/faiss_indexes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    container_name: docuchat-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_APP_NAME: DOCTool
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  seaweedfs_data:
  uploads_data:
  indexes_data:
